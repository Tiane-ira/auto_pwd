<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自动填充规则管理</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>自动填充规则</h1>
      <div class="header-actions">
        <label class="switch-container" title="启用/禁用页面自动填充">
          <input type="checkbox" id="autoFillToggle" checked>
          <span class="switch-label"></span>
        </label>

        <button id="pickElementBtn" class="btn btn-picker" title="选取页面元素并复制 XPath 路径">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="9" height="9" rx="1" stroke-dasharray="3 2"/>
            <path d="M15 15l7 7"/>
            <path d="M15 15l-2.5 2.5M15 15l2.5-2.5"/>
            <circle cx="15" cy="15" r="4"/>
          </svg>
        </button>
        <button id="addRuleBtn" class="btn btn-primary" title="新建一条填充规则">+</button>
        <div class="dropdown">
          <button id="moreOptionsBtn" class="btn btn-secondary">...</button>
          <div id="moreOptionsDropdown" class="dropdown-content">
            <button id="exportRulesBtn" class="dropdown-item">导出规则</button>
            <button id="importRulesBtn" class="dropdown-item">导入规则</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Tab切换 -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="current">当前网址</button>
      <button class="tab-btn" data-tab="all">所有规则</button>
    </div>

    <!-- 当前网址匹配的规则 -->
    <div id="currentTab" class="tab-content active">
      <!-- 当前网址数据组管理工具栏 -->
      <div id="urlGroupsToolbar" class="url-groups-toolbar" style="display: none;">
        <div class="url-groups-header">
          <div class="url-groups-title-wrap">
            <span class="url-groups-title">网址数据组:</span>
            <span class="url-groups-hint">点击切换默认填充组</span>
          </div>
          <div class="url-groups-actions">
            <button type="button" id="triggerFillBtn" class="btn btn-small btn-primary" title="使用当前默认数据组填充页面">⚡ 立即填充</button>
          </div>
        </div>
        <div id="urlGroupsPills" class="url-groups-pills"></div>
      </div>

      <div id="currentRulesList" class="rules-list">
        <!-- 当前网址匹配的规则将动态生成 -->
      </div>
    </div>

    <!-- 按网址分组的规则列表 -->
    <div id="allTab" class="tab-content">
      <div id="allRulesList" class="rules-list">
        <!-- 按网址分组的规则将动态生成 -->
      </div>
    </div>

    <!-- 导入规则确认模态框 -->
    <div id="importModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>导入规则</h2>
          <span class="close-import">&times;</span>
        </div>
        <div class="modal-body">
          <p>您确定要导入新的规则吗？这将会覆盖现有的所有规则。</p>
          <div class="form-actions">
            <button type="button" id="confirmImportBtn" class="btn btn-danger">确认导入</button>
            <button type="button" class="btn btn-secondary" id="cancelImportBtn">取消</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 添加/编辑规则模态框 -->
    <div id="ruleModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">添加规则</h2>
          <span class="close">&times;</span>
        </div>
        <div class="modal-body">
          <form id="ruleForm">
            <div class="form-group">
              <label for="urlsList">绑定网址列表:</label>
              <div class="urls-container">
                <div id="urlsList" class="urls-list"></div>
                <div class="url-input-group">
                  <input type="text" id="urlInput" placeholder="输入网址或点击右侧按钮添加当前网址" class="url-input">
                  <button type="button" id="addCurrentUrlBtn" class="btn btn-small">添加当前网址</button>
                  <button type="button" id="addUrlBtn" class="btn btn-small btn-primary">添加</button>
                </div>
              </div>
            </div>

            <!-- 表单项设置 (待填充的网页字段) -->
            <div class="form-group">
              <div class="section-header">
                <label>表单项设置 (待填充的网页字段):</label>
                <button type="button" id="addFieldBtn" class="btn btn-small btn-secondary">+ 添加表单项</button>
              </div>
              <p class="form-hint">为本页面的各个输入框添加字段名称与对应的 XPath 选择器。</p>
              <div id="fieldsContainer" class="fields-container">
                <div class="fields-header-row">
                  <div class="field-col-name">表单项名称</div>
                  <div class="field-col-selector">XPath 选择器</div>
                  <div class="field-col-action">操作</div>
                </div>
                <div id="fieldsList" class="fields-list"></div>
              </div>
            </div>

            <!-- 填充数据分组设置 (先选择分组，再同时编辑其所有表单项) -->
            <div class="form-group">
              <div class="section-header">
                <label>填充数据分组设置 (先选分组，同时编辑该组所有数据项):</label>
                <button type="button" id="addGroupBtn" class="btn btn-small btn-secondary">+ 添加数据组</button>
              </div>
              <p class="form-hint">点击下方标签切换不同数据组，可在一个视图下同时编辑该组的所有表单数据项：</p>
              
              <!-- 分组选择标签栏 (先选择分组) -->
              <div id="groupTabsBar" class="group-tabs-bar"></div>

              <!-- 当前激活分组的统一编辑面板 (同时编辑该分组下的所有数据项) -->
              <div id="activeGroupEditor" class="active-group-editor">
                <div class="active-group-toolbar">
                  <div class="active-group-name-wrap">
                    <label for="activeGroupNameInput">分组名称:</label>
                    <input type="text" id="activeGroupNameInput" class="active-group-name-input" placeholder="如: 管理员 / 测试账号">
                  </div>
                  <label class="active-group-default-label" title="将此分组设为页面默认填充组">
                    <input type="checkbox" id="activeGroupDefaultCheck">
                    <span>设为默认填充组</span>
                  </label>
                  <button type="button" id="deleteActiveGroupBtn" class="btn-delete-group-text" title="删除当前选中的分组">删除此组</button>
                </div>
                <div class="active-group-fields-header">
                  <span>当前组各表单项填充值:</span>
                  <span class="active-group-hint">为本分组配置所有表单字段值 (可留空)</span>
                </div>
                <div id="activeGroupFieldsList" class="active-group-fields-list">
                  <!-- 动态生成该分组下所有表单项的输入行 -->
                </div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">保存</button>
              <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
